name: CI

# Every branch, not just main. Filtering to `main` meant a branch could be
# merged on the strength of a local run, and the CI configuration itself was
# the thing least likely to have been exercised before it landed.
on:
  push:
  pull_request:

permissions:
  contents: read

# A pull request from a branch in this repo fires both triggers. Keep the
# newest run per ref and cancel the rest.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # --locked, not --frozen: uv.lock is committed, so a lockfile that has
      # drifted from pyproject should fail here rather than resolve silently
      # into something no contributor is running.
      - run: uv sync --locked --all-extras --dev
        env:
          UV_PYTHON: ${{ matrix.python-version }}

      - name: ruff
        run: uv run ruff check .

      - name: mypy
        run: uv run mypy

      # No network and no model calls: the `calibration` marker is deselected by
      # default in pyproject, and everything else injects test doubles.
      #
      # `--cov-fail-under` and not a report nobody reads. A coverage number
      # printed into a log is a number that drifts down one PR at a time with
      # nothing objecting; a floor is the part that can fail. It is set at the
      # level already reached rather than an aspiration, so it ratchets — raise
      # it when the real number moves, and let it block the change that drops it.
      #
      # 84, and nothing is excluded to make that number look better. It would be
      # 91 without `survey.py` and `triage_run.py`, which are operator scripts
      # run by hand and never on a developer's machine — but a coverage config
      # that omits the modules it is embarrassed by measures the wrong thing.
      # They are in, they are the bulk of the gap, and the floor says so.
      - name: pytest
        run: uv run pytest -q --cov=grask --cov-report=term-missing --cov-fail-under=84

  # grask's runtime floor is Python 3.8 (requires-python), but its dev toolchain
  # (pytest 9, mypy) needs newer, so 3.8 cannot go in the matrix above. This job
  # runs the suite on 3.8 with a 3.8-compatible pytest and no install (PYTHONPATH,
  # as the hooks do). It is the only guard against a 3.9+ stdlib API — e.g.
  # importlib.resources.files — silently creeping back into src and re-breaking
  # the pyenv-3.9 machines this floor exists for.
  floor:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: pytest on the 3.8 floor
        run: uv run --python 3.8 --with pytest --no-project python -m pytest -q

  # The README's install is `uv tool install .`, and both delivery surfaces
  # invoke `grask` by name. That contract broke once already without any test
  # noticing, because the suite imports the package and never installs it.
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7

      - name: install as a tool
        run: uv tool install .

      - name: console scripts exist and run
        env:
          GRASK_HOME: ${{ runner.temp }}/grask-home
        run: |
          grask --help
          # A GRASK_HOME this run just created has never captured anything, and
          # an empty queue has to say which of the four kinds of empty it is.
          grask serve --json | grep -q '"pending": null'
          grask serve --json | grep -q '"reason": "never"'
          # `stats` is the one command a developer runs against a database that
          # has never been written to, so an empty one must render rather than
          # divide by zero or crash on a missing table.
          grask stats | grep -q 'Nothing answered yet'
          # The hook takes its payload on stdin and must exit 0 on anything,
          # including a payload it cannot use. It never has a --help to call.
          echo '{}' | grask-hook

      # SKILL.md is read out of the installed package, so this passes only if
      # the build actually shipped it in the wheel. A checkout is not evidence:
      # the file was present in the tree the whole time it was missing from the
      # artifact everyone installs.
      - name: the shipped skill survives packaging
        run: |
          cd "$(mktemp -d)"
          grask skill --install --dir ./skills
          test -f ./skills/grask/SKILL.md
          head -2 ./skills/grask/SKILL.md | grep -q '^name: grask$'

  # The repo is also a Claude Code plugin. `plugin validate` is offline — it
  # checks the manifest, marketplace, hooks, and skill frontmatter against the
  # schema without contacting Anthropic. The SKILL.md mirror and JSON validity
  # are pinned in tests/test_plugin.py too; this is the fuller schema check.
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code
      - name: validate the plugin and marketplace manifests
        run: claude plugin validate .
